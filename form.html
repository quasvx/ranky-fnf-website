<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes">
    <title>Ranky Form | Staff Application</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        :root {
            --bg-body: #f1f5f9;
            --bg-card: #ffffff;
            --text-primary: #0f172a;
            --text-secondary: #334155;
            --text-muted: #64748b;
            --border-light: #e2e8f0;
            --border-focus: #3b82f6;
            --accent: #3b82f6;
            --accent-soft: #dbeafe;
            --hero-bg: #f8fafc;
            --input-bg: #ffffff;
            --shadow: 0 20px 35px -12px rgba(0, 0, 0, 0.08);
            --btn-bg: #1e293b;
            --btn-hover: #0f172a;
            --captcha-bg: #f8fafc;
            --sidebar-bg: rgba(255, 255, 255, 0.98);
            --overlay: rgba(0, 0, 0, 0.25);
            --error: #dc2626;
            --success: #22c55e;
            --warning: #f59e0b;
        }
        body.dark {
            --bg-body: #0f172a;
            --bg-card: #1e293b;
            --text-primary: #f1f5f9;
            --text-secondary: #cbd5e1;
            --text-muted: #94a3b8;
            --border-light: #334155;
            --border-focus: #60a5fa;
            --accent: #60a5fa;
            --accent-soft: #1e293b;
            --hero-bg: #111827;
            --input-bg: #0f172a;
            --shadow: 0 20px 35px -12px rgba(0, 0, 0, 0.4);
            --btn-bg: #334155;
            --btn-hover: #475569;
            --captcha-bg: #0f172a;
            --sidebar-bg: rgba(30, 41, 59, 0.98);
            --overlay: rgba(0, 0, 0, 0.5);
        }
        body {
            font-family: 'Inter', sans-serif;
            background: var(--bg-body);
            color: var(--text-primary);
            min-height: 100vh;
            padding: 2rem 1rem;
            transition: all 0.2s ease;
        }
        @keyframes fadeSlideUp {
            from { opacity: 0; transform: translateY(30px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .main-card {
            background: var(--bg-card);
            border-radius: 1.75rem;
            box-shadow: var(--shadow);
            border: 1px solid var(--border-light);
            overflow: hidden;
            animation: fadeSlideUp 0.6s ease forwards;
            max-width: 1000px;
            margin: 0 auto;
        }
        .hero-section {
            background: var(--hero-bg);
            padding: 2rem;
            text-align: center;
            border-bottom: 1px solid var(--border-light);
        }
        .hero-section h1 {
            font-weight: 700;
            font-size: clamp(1.8rem, 5vw, 2.5rem);
            color: var(--text-primary);
        }
        .hero-section p {
            color: var(--text-muted);
            font-weight: 500;
            font-size: 0.85rem;
            text-transform: uppercase;
            margin-top: 0.5rem;
        }
        .section-label {
            font-weight: 600;
            font-size: 1rem;
            color: var(--text-secondary);
            border-left: 3px solid var(--accent);
            padding-left: 0.9rem;
            margin: 2rem 0 1.5rem 0;
        }
        .form-label {
            font-weight: 600;
            font-size: 0.85rem;
            color: var(--text-secondary);
            margin-bottom: 0.5rem;
            display: block;
        }
        .form-control, .form-select {
            background: var(--input-bg);
            border: 1.5px solid var(--border-light);
            border-radius: 1rem;
            padding: 0.75rem 1rem;
            font-size: 0.9rem;
            color: var(--text-primary);
            transition: all 0.2s;
            width: 100%;
        }
        .form-control:focus, .form-select:focus {
            border-color: var(--border-focus);
            box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.15);
            outline: none;
        }
        .btn-submit {
            background: var(--btn-bg);
            border: none;
            padding: 0.9rem;
            border-radius: 2rem;
            font-weight: 700;
            font-size: 1rem;
            color: white;
            transition: all 0.2s;
            width: 100%;
            margin-top: 2rem;
            cursor: pointer;
        }
        .btn-submit:hover:not(:disabled) {
            background: var(--btn-hover);
            transform: translateY(-2px);
        }
        .btn-submit:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }
        .captcha-box {
            background: var(--captcha-bg);
            border-radius: 1.25rem;
            padding: 1.5rem;
            margin-top: 2rem;
            border: 1px solid var(--border-light);
            text-align: center;
        }
        .captcha-canvas {
            background: #1a1a2e;
            border-radius: 0.75rem;
            padding: 0.5rem;
            margin-bottom: 1rem;
            display: inline-block;
            cursor: pointer;
            border: 2px solid var(--border-light);
        }
        canvas {
            background: #2d2d44;
            border-radius: 0.5rem;
            display: block;
            margin: 0 auto;
        }
        .captcha-input {
            display: flex;
            gap: 1rem;
            align-items: center;
            justify-content: center;
            flex-wrap: wrap;
        }
        .captcha-input input {
            width: 160px;
            text-align: center;
            letter-spacing: 4px;
            font-size: 1.2rem;
            text-transform: uppercase;
        }
        .captcha-refresh {
            background: var(--accent-soft);
            border: none;
            padding: 0.5rem 1rem;
            border-radius: 2rem;
            cursor: pointer;
            color: var(--text-primary);
            font-weight: 600;
        }
        .captcha-status {
            margin-top: 0.75rem;
            font-size: 0.8rem;
        }
        .captcha-status.success { color: var(--success); }
        .captcha-status.error { color: var(--error); }
        .captcha-status.warning { color: var(--warning); }
        .captcha-hint {
            font-size: 0.7rem;
            color: var(--text-muted);
            margin-top: 0.5rem;
        }
        .menu-corner {
            position: fixed;
            top: 1.2rem;
            left: 1.2rem;
            z-index: 1050;
        }
        .menu-btn {
            background: var(--bg-card);
            border: 1px solid var(--border-light);
            padding: 0.6rem 1.4rem;
            border-radius: 2rem;
            font-weight: 600;
            font-size: 0.9rem;
            color: var(--text-primary);
            cursor: pointer;
            transition: all 0.2s;
        }
        .menu-btn:hover {
            background: var(--accent-soft);
            border-color: var(--accent);
        }
        .sidebar-menu {
            position: fixed;
            top: 0;
            left: -320px;
            width: 300px;
            height: 100%;
            background: var(--sidebar-bg);
            backdrop-filter: blur(20px);
            z-index: 1060;
            transition: left 0.3s;
            padding: 2rem 1.5rem;
            border-right: 1px solid var(--border-light);
            display: flex;
            flex-direction: column;
            gap: 1.5rem;
        }
        .sidebar-menu.open { left: 0; }
        .menu-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: var(--overlay);
            backdrop-filter: blur(3px);
            z-index: 1055;
            visibility: hidden;
            opacity: 0;
            transition: 0.2s;
        }
        .menu-overlay.active { visibility: visible; opacity: 1; }
        .close-sidebar {
            background: none;
            border: none;
            font-size: 1.6rem;
            align-self: flex-end;
            cursor: pointer;
            color: var(--text-muted);
        }
        .menu-title {
            font-weight: 700;
            font-size: 1.5rem;
            color: var(--text-primary);
            border-bottom: 2px solid var(--border-light);
            padding-bottom: 0.5rem;
        }
        .menu-item {
            padding: 0.7rem 0;
            font-weight: 500;
            color: var(--text-secondary);
            cursor: pointer;
            transition: 0.15s;
            border-bottom: 1px solid var(--border-light);
            display: flex;
            align-items: center;
            gap: 12px;
        }
        .menu-item:hover { color: var(--accent); transform: translateX(6px); }
        .external-btn {
            background: var(--input-bg);
            border: 1px solid var(--border-light);
            padding: 0.7rem;
            border-radius: 1rem;
            font-weight: 600;
            text-align: center;
            text-decoration: none;
            display: block;
            color: var(--text-primary);
        }
        .lang-row {
            display: flex;
            gap: 12px;
            padding-top: 0.5rem;
            border-top: 1px solid var(--border-light);
        }
        .lang-row button {
            flex: 1;
            background: var(--input-bg);
            border: 1px solid var(--border-light);
            padding: 0.6rem;
            border-radius: 2rem;
            font-weight: 600;
            color: var(--text-primary);
            cursor: pointer;
        }
        .theme-switch-inline {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: var(--input-bg);
            padding: 0.7rem 1rem;
            border-radius: 3rem;
            border: 1px solid var(--border-light);
        }
        .toggle-switch {
            width: 48px;
            height: 24px;
            background: var(--border-light);
            border-radius: 50px;
            position: relative;
            cursor: pointer;
        }
        .toggle-switch::after {
            content: "";
            width: 20px;
            height: 20px;
            background: white;
            border-radius: 50%;
            position: absolute;
            top: 2px;
            left: 3px;
            transition: 0.2s;
        }
        body.dark .toggle-switch::after { left: 25px; background: #0f172a; }
        .credits-footer {
            font-size: 0.7rem;
            text-align: center;
            color: var(--text-muted);
            margin-top: 0.5rem;
        }
        #successModal {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.7);
            backdrop-filter: blur(12px);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 2000;
        }
        .modal-card {
            background: var(--bg-card);
            max-width: 450px;
            width: 90%;
            border-radius: 1.75rem;
            padding: 2rem;
            text-align: center;
        }
        .row { display: flex; flex-wrap: wrap; gap: 1rem; margin-bottom: 1rem; }
        .col-md-6 { flex: 1; min-width: calc(50% - 0.5rem); }
        .col-md-4 { flex: 1; min-width: calc(33.33% - 0.66rem); }
        .col-12 { width: 100%; }
        @media (max-width: 640px) {
            body { padding: 1rem; }
            .col-md-6, .col-md-4 { min-width: 100%; }
        }
    </style>
</head>
<body>
    <div class="menu-corner">
        <button class="menu-btn" id="menuBtn">☰ Menú</button>
    </div>
    <div class="sidebar-menu" id="sidebar">
        <button class="close-sidebar" id="closeSidebarBtn">✕</button>
        <div class="menu-title" id="menuTitle">Menú</div>
        <div class="menu-item" id="backToRootItem">🏠 Volver al Inicio</div>
        <div class="external-link">
            <a href="https://www.quasvx.cc.cd" target="_blank" class="external-btn">⚡ Quasvx</a>
        </div>
        <div class="theme-switch-inline">
            <span id="themeLabel">🌙 Modo oscuro</span>
            <div class="toggle-switch" id="themeToggle"></div>
        </div>
        <div class="lang-row">
            <button id="langEsBtn">🇪🇸 ES</button>
            <button id="langEnBtn">🇬🇧 EN</button>
        </div>
        <div class="credits-footer" id="footerCredits">Ranky Form • Staff Application</div>
    </div>
    <div class="menu-overlay" id="menuOverlay"></div>

    <div class="main-card">
        <div class="hero-section">
            <h1 id="title">Ranky Form</h1>
            <p id="subtitle">Staff Application 2026</p>
        </div>
        <div style="padding: 2rem;">
            <form id="applicationForm">
                <div class="section-label" id="sec1">📋 01. Datos personales</div>
                <div class="row">
                    <div class="col-md-6">
                        <label class="form-label" id="lDiscord">Discord *</label>
                        <input type="text" id="discord" class="form-control" placeholder="usuario#0000" required>
                    </div>
                    <div class="col-md-6">
                        <label class="form-label" id="lEmail">Correo electrónico *</label>
                        <input type="email" id="email" class="form-control" placeholder="tu@email.com" required>
                    </div>
                </div>
                <div class="section-label" id="sec2">🛠️ 02. Perfil profesional</div>
                <div class="row">
                    <div class="col-md-6">
                        <label class="form-label" id="lRole">Rol principal *</label>
                        <select id="role" class="form-select" required>
                            <option value="" disabled selected id="optSelect">Seleccionar</option>
                            <option value="Coder" id="optCoder">Desarrollador/a</option>
                            <option value="Artist" id="optArtist">Artista gráfico</option>
                            <option value="Musician" id="optMusic">Compositor/a</option>
                            <option value="Charter" id="optChart">Charter</option>
                        </select>
                    </div>
                    <div class="col-md-6">
                        <label class="form-label" id="lTools">Herramientas principales *</label>
                        <input type="text" id="software" class="form-control" placeholder="Ej: Figma, Unity, FL Studio" required>
                    </div>
                </div>
                <div class="row">
                    <div class="col-md-4">
                        <label class="form-label" id="lAge">Edad *</label>
                        <input type="number" id="age" class="form-control" min="13" required>
                    </div>
                    <div class="col-md-4">
                        <label class="form-label" id="lHours">Horas semanales *</label>
                        <input type="number" id="hours" class="form-control" required>
                    </div>
                    <div class="col-md-4">
                        <label class="form-label" id="lSkill">Nivel (0-100) *</label>
                        <input type="number" id="skill" class="form-control" min="0" max="100" required>
                    </div>
                </div>
                <div class="section-label" id="sec3">✨ 03. Motivación y experiencia</div>
                <div class="row">
                    <div class="col-12">
                        <label class="form-label" id="lPortfolio">Portafolio / GitHub / GameBanana *</label>
                        <input type="text" id="portfolio" class="form-control" required>
                    </div>
                </div>
                <div class="row">
                    <div class="col-12">
                        <label class="form-label" id="lExperience">Experiencia previa *</label>
                        <textarea id="experience" class="form-control" rows="2" required></textarea>
                    </div>
                </div>
                <div class="row">
                    <div class="col-12">
                        <label class="form-label" id="lMotivation">¿Por qué quieres unirte? *</label>
                        <textarea id="motivation" class="form-control" rows="3" required></textarea>
                    </div>
                </div>
                <div class="row">
                    <div class="col-12">
                        <label class="form-label" id="lConflict">Ejemplo de resolución de conflictos *</label>
                        <textarea id="conflict" class="form-control" rows="2" required></textarea>
                    </div>
                </div>
                <div class="row">
                    <div class="col-12">
                        <label class="form-label" id="lFuture">Meta a 1 año *</label>
                        <textarea id="future" class="form-control" rows="2" required></textarea>
                    </div>
                </div>

                <div class="captcha-box">
                    <label class="form-label" id="verifyLabel">🔐 Verificación de seguridad</label>
                    <div class="captcha-canvas" id="captchaCanvas" title="Haz clic para actualizar">
                        <canvas id="captchaImage" width="260" height="80"></canvas>
                    </div>
                    <div class="captcha-input">
                        <input type="text" id="captchaInput" class="form-control" placeholder="Código" maxlength="4" autocomplete="off" style="text-transform: uppercase;">
                        <button type="button" id="refreshCaptcha" class="captcha-refresh">⟳ Actualizar</button>
                    </div>
                    <div id="captchaStatus" class="captcha-status"></div>
                    <div class="captcha-hint" id="captchaHint">🔍 Incluye letras MAYÚSCULAS y números. Haz clic en la imagen si no se lee bien.</div>
                </div>
                <div id="securityAlert" style="color:var(--error); font-size:0.85rem; margin-top:1rem; display:none; text-align:center;"></div>
                <button type="submit" class="btn-submit" id="submitBtn">📤 Enviar solicitud</button>
            </form>
        </div>
    </div>
    <div id="successModal">
        <div class="modal-card">
            <div style="font-size:3rem;">✅</div>
            <h3 id="modalTitle">Solicitud enviada</h3>
            <div id="modalMessage"></div>
            <button onclick="closeSuccessModal()" class="btn-submit" style="margin-top:1rem;">Cerrar</button>
        </div>
    </div>

    <script>
        // ========== INTERCEPTAR CONSOLA (sin bloquear scripts internos) ==========
        (function() {
            // Guardar funciones originales
            const originalLog = console.log;
            const originalWarn = console.warn;
            const originalError = console.error;
            const originalInfo = console.info;
            const originalDebug = console.debug;
            
            // Mensaje divertido
            const naMsg = 'na na na 😏🥀🙏';
            
            // Reemplazar console functions (solo para output, no para lógica)
            console.log = function(...args) {
                if (args.length === 1 && typeof args[0] === 'string' && args[0].includes('na na')) {
                    originalLog.apply(console, args);
                } else {
                    originalLog.call(console, naMsg);
                }
            };
            console.warn = function() { originalLog.call(console, naMsg); };
            console.error = function() { originalLog.call(console, naMsg); };
            console.info = function() { originalLog.call(console, naMsg); };
            console.debug = function() { originalLog.call(console, naMsg); };
            
            // Bloquear eval y Function (pero no romper el código)
            const originalEval = window.eval;
            window.eval = function(str) {
                if (typeof str === 'string' && (str.includes('getCookie') || str.includes('setCookie') || str.includes('localStorage'))) {
                    return null;
                }
                return null;
            };
            
            // Limpiar consola periódicamente
            setInterval(() => {
                if (window.console.clear) {
                    try { console.clear(); } catch(e) {}
                }
            }, 500);
            
            originalLog.call(console, '%c🔒 Consola bloqueada', 'color: #ef4444; font-size: 12px;');
        })();

        const API_URL = 'https://ranky.api.otp.cc.cd/api/api';

        // ========== COOKIES (para tema e idioma) ==========
        function setCookie(name, value, days = 365) {
            try {
                let expires = "";
                if (days) {
                    const d = new Date();
                    d.setTime(d.getTime() + days * 24 * 60 * 60 * 1000);
                    expires = "; expires=" + d.toUTCString();
                }
                document.cookie = name + "=" + (value || "") + expires + "; path=/";
            } catch(e) {}
        }
        
        function getCookie(name) {
            try {
                if (!document.cookie) return null;
                const match = document.cookie.match(new RegExp('(^| )' + name + '=([^;]+)'));
                return match ? match[2] : null;
            } catch(e) {
                return null;
            }
        }
        
        // ========== EVERCOOKIE PARA BAN ==========
        const BAN_KEY = 'ranky_banned_until';
        
        function setEvercookieBan(minutes) {
            const bannedUntil = Date.now() + (minutes * 60 * 1000);
            const value = bannedUntil.toString();
            const expireDate = new Date();
            expireDate.setTime(expireDate.getTime() + (minutes * 60 * 1000));
            
            try {
                document.cookie = `${BAN_KEY}=${value}; expires=${expireDate.toUTCString()}; path=/; SameSite=Lax`;
                localStorage.setItem(BAN_KEY, value);
                sessionStorage.setItem(BAN_KEY, value);
                window.name = `${BAN_KEY}=${value}`;
                
                try {
                    const request = indexedDB.open('rankyDB', 2);
                    request.onupgradeneeded = function(event) {
                        const db = event.target.result;
                        if (!db.objectStoreNames.contains('banStore')) {
                            db.createObjectStore('banStore');
                        }
                    };
                    request.onsuccess = function(event) {
                        const db = event.target.result;
                        if (db.objectStoreNames.contains('banStore')) {
                            const tx = db.transaction('banStore', 'readwrite');
                            const store = tx.objectStore('banStore');
                            store.put(value, BAN_KEY);
                            tx.oncomplete = () => db.close();
                        } else {
                            db.close();
                        }
                    };
                } catch(e) {}
            } catch(e) {}
        }
        
        async function getEvercookieBan() {
            try {
                const cookieMatch = document.cookie.match(new RegExp('(^| )' + BAN_KEY + '=([^;]+)'));
                if (cookieMatch) return cookieMatch[2];
                
                const ls = localStorage.getItem(BAN_KEY);
                if (ls) return ls;
                
                const ss = sessionStorage.getItem(BAN_KEY);
                if (ss) return ss;
                
                if (window.name && window.name.startsWith(`${BAN_KEY}=`)) {
                    return window.name.split('=')[1];
                }
                
                try {
                    const value = await new Promise((resolve) => {
                        const request = indexedDB.open('rankyDB', 2);
                        request.onupgradeneeded = function() { resolve(null); };
                        request.onsuccess = function(event) {
                            const db = event.target.result;
                            if (db.objectStoreNames.contains('banStore')) {
                                const tx = db.transaction('banStore', 'readonly');
                                const store = tx.objectStore('banStore');
                                const getReq = store.get(BAN_KEY);
                                getReq.onsuccess = () => {
                                    db.close();
                                    resolve(getReq.result || null);
                                };
                                getReq.onerror = () => {
                                    db.close();
                                    resolve(null);
                                };
                            } else {
                                db.close();
                                resolve(null);
                            }
                        };
                        request.onerror = () => resolve(null);
                    });
                    if (value) return value;
                } catch(e) {}
                
                return null;
            } catch(e) {
                return null;
            }
        }
        
        async function isBanned() {
            const value = await getEvercookieBan();
            if (!value) return false;
            const bannedUntil = parseInt(value);
            return bannedUntil > Date.now();
        }

        // ========== TEMA CLARO/OSCURO ==========
        function initTheme() {
            try {
                const saved = getCookie('ranky_theme');
                const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
                const theme = saved || (prefersDark ? 'dark' : 'light');
                if (theme === 'dark') {
                    document.body.classList.add('dark');
                } else {
                    document.body.classList.remove('dark');
                }
            } catch(e) {}
        }
        
        function toggleTheme() {
            try {
                if (document.body.classList.contains('dark')) {
                    document.body.classList.remove('dark');
                    setCookie('ranky_theme', 'light', 365);
                } else {
                    document.body.classList.add('dark');
                    setCookie('ranky_theme', 'dark', 365);
                }
            } catch(e) {}
        }
        
        // ========== TRADUCCIONES ==========
        const texts = {
            en: {
                menuTitle: "Menu", backToRoot: "🏠 Back to Root", themeLabel: "🌙 Dark mode",
                footer: "Ranky Form • Staff Application",
                title: "Ranky Form", subtitle: "Staff Application 2026",
                sec1: "📋 01. Personal info", sec2: "🛠️ 02. Professional profile", sec3: "✨ 03. Motivation & experience",
                lDiscord: "Discord *", lEmail: "Email *", lRole: "Main role *", optSelect: "Select",
                optCoder: "Developer", optArtist: "Graphic Artist", optMusic: "Composer", optChart: "Charter",
                lTools: "Main tools *", lAge: "Age *", lHours: "Weekly hours *", lSkill: "Skill level (0-100) *",
                lPortfolio: "Portfolio / GitHub / GameBanana *", lExperience: "Previous experience *",
                lMotivation: "Why join us? *", lConflict: "Conflict resolution *", lFuture: "1-year goal *",
                verifyLabel: "🔐 Security verification", submitBtn: "📤 Submit application",
                modalTitle: "Application sent", modalTextValid: "We will contact you from:",
                modalTextInvalid: "⚠️ Invalid email. We cannot contact you.", contactEmail: "quasvx@outlook.es",
                captchaHint: "🔍 Includes UPPERCASE letters and numbers. Click image if not readable.",
                errors: { mouse: "Move your mouse first.", speed: "Too fast. Wait.", paste: "Avoid excessive pasting." }
            },
            es: {
                menuTitle: "Menú", backToRoot: "🏠 Volver al Inicio", themeLabel: "🌙 Modo oscuro",
                footer: "Ranky Form • Solicitud de Staff",
                title: "Ranky Form", subtitle: "Solicitud de Staff 2026",
                sec1: "📋 01. Datos personales", sec2: "🛠️ 02. Perfil profesional", sec3: "✨ 03. Motivación y experiencia",
                lDiscord: "Discord *", lEmail: "Correo *", lRole: "Rol principal *", optSelect: "Seleccionar",
                optCoder: "Desarrollador/a", optArtist: "Artista gráfico", optMusic: "Compositor/a", optChart: "Charter",
                lTools: "Herramientas *", lAge: "Edad *", lHours: "Horas semanales *", lSkill: "Nivel (0-100) *",
                lPortfolio: "Portafolio / GitHub / GameBanana *", lExperience: "Experiencia previa *",
                lMotivation: "¿Por qué unirte? *", lConflict: "Resolver conflictos *", lFuture: "Meta a 1 año *",
                verifyLabel: "🔐 Verificación", submitBtn: "📤 Enviar solicitud",
                modalTitle: "Solicitud enviada", modalTextValid: "Te contactaremos desde:",
                modalTextInvalid: "⚠️ Email inválido. No podemos contactarte.", contactEmail: "quasvx@outlook.es",
                captchaHint: "🔍 Incluye letras MAYÚSCULAS y números. Haz clic en la imagen si no se lee bien.",
                errors: { mouse: "Mueve el ratón primero.", speed: "Demasiado rápido. Espera.", paste: "Evita pegar en exceso." }
            }
        };
        
        let currentLang = 'es';
        
        function applyLanguage(lang) {
            try {
                currentLang = lang;
                setCookie('ranky_lang', lang, 365);
                const t = texts[lang];
                if (!t) return;
                
                const elements = {
                    menuTitle: 'menuTitle',
                    backToRootItem: 'backToRootItem',
                    themeLabel: 'themeLabel',
                    footerCredits: 'footerCredits',
                    title: 'title',
                    subtitle: 'subtitle',
                    sec1: 'sec1',
                    sec2: 'sec2',
                    sec3: 'sec3',
                    lDiscord: 'lDiscord',
                    lEmail: 'lEmail',
                    lRole: 'lRole',
                    optSelect: 'optSelect',
                    optCoder: 'optCoder',
                    optArtist: 'optArtist',
                    optMusic: 'optMusic',
                    optChart: 'optChart',
                    lTools: 'lTools',
                    lAge: 'lAge',
                    lHours: 'lHours',
                    lSkill: 'lSkill',
                    lPortfolio: 'lPortfolio',
                    lExperience: 'lExperience',
                    lMotivation: 'lMotivation',
                    lConflict: 'lConflict',
                    lFuture: 'lFuture',
                    verifyLabel: 'verifyLabel',
                    submitBtn: 'submitBtn',
                    modalTitle: 'modalTitle',
                    captchaHint: 'captchaHint'
                };
                
                for (const [key, id] of Object.entries(elements)) {
                    const el = document.getElementById(id);
                    if (el && t[key]) el.innerText = t[key];
                }
                
                const menuBtn = document.getElementById('menuBtn');
                if (menuBtn) menuBtn.innerText = lang === 'es' ? '☰ Menú' : '☰ Menu';
            } catch(e) {}
        }

        // ========== CAPTCHA ==========
        let currentCaptchaCode = '';
        let captchaFailCount = 0;
        let userBanned = false;
        
        async function checkBanStatus() {
            userBanned = await isBanned();
            if (userBanned) {
                document.getElementById('submitBtn').disabled = true;
                document.getElementById('captchaInput').disabled = true;
                document.getElementById('refreshCaptcha').disabled = true;
                document.getElementById('captchaStatus').innerHTML = '🚫 IP BANEADA por 25 minutos';
                document.getElementById('captchaStatus').className = 'captcha-status error';
            }
        }
        
        function generateRandomCode() {
            const chars = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
            let result = '';
            for (let i = 0; i < 4; i++) {
                result += chars.charAt(Math.floor(Math.random() * chars.length));
            }
            return result;
        }
        
        function drawDistortedText(code) {
            const canvas = document.getElementById('captchaImage');
            if (!canvas) return;
            const ctx = canvas.getContext('2d');
            const width = 260;
            const height = 80;
            
            canvas.width = width;
            canvas.height = height;
            
            const grad = ctx.createLinearGradient(0, 0, width, height);
            grad.addColorStop(0, '#1a1a2e');
            grad.addColorStop(1, '#16213e');
            ctx.fillStyle = grad;
            ctx.fillRect(0, 0, width, height);
            
            ctx.strokeStyle = 'rgba(100, 100, 150, 0.2)';
            ctx.lineWidth = 0.5;
            for (let i = 0; i < width; i += 15) {
                ctx.beginPath();
                ctx.moveTo(i, 0);
                ctx.lineTo(i, height);
                ctx.stroke();
                ctx.beginPath();
                ctx.moveTo(0, i);
                ctx.lineTo(width, i);
                ctx.stroke();
            }
            
            const chars = code.split('');
            const startX = 35;
            const startY = 52;
            
            chars.forEach((char, index) => {
                const x = startX + (index * 48);
                const y = startY + (Math.random() * 20 - 10);
                const rotation = (Math.random() - 0.5) * 1.4;
                const skewX = Math.random() * 0.6 - 0.3;
                const skewY = Math.random() * 0.4 - 0.2;
                
                ctx.save();
                ctx.translate(x, y);
                ctx.rotate(rotation);
                ctx.transform(1, skewX, skewY, 1, 0, 0);
                ctx.font = `bold ${36 + Math.random() * 10}px "Courier New", "Monaco", monospace`;
                const hue = 20 + Math.random() * 60;
                ctx.fillStyle = `hsl(${hue}, 80%, 60%)`;
                ctx.fillText(char, 0, 0);
                ctx.restore();
            });
            
            for (let i = 0; i < 15; i++) {
                ctx.beginPath();
                ctx.moveTo(Math.random() * width, Math.random() * height);
                ctx.lineTo(Math.random() * width, Math.random() * height);
                ctx.strokeStyle = `rgba(180, 180, 220, ${Math.random() * 0.4 + 0.2})`;
                ctx.lineWidth = Math.random() * 2.5 + 0.5;
                ctx.stroke();
            }
            
            for (let i = 0; i < 500; i++) {
                ctx.fillStyle = `rgba(255, 255, 255, ${Math.random() * 0.6})`;
                ctx.fillRect(Math.random() * width, Math.random() * height, 1.5, 1.5);
            }
        }
        
        function refreshCaptcha() {
            if (userBanned) return;
            currentCaptchaCode = generateRandomCode();
            drawDistortedText(currentCaptchaCode);
            const input = document.getElementById('captchaInput');
            const status = document.getElementById('captchaStatus');
            if (input) input.value = '';
            if (status) status.innerHTML = '';
        }
        
        async function verifyCaptcha() {
            if (userBanned) {
                const status = document.getElementById('captchaStatus');
                if (status) {
                    status.innerHTML = '🚫 BANEADO por 25 minutos';
                    status.className = 'captcha-status error';
                }
                return false;
            }
            
            const input = document.getElementById('captchaInput');
            const status = document.getElementById('captchaStatus');
            
            if (!input || !status) return false;
            
            let userInput = input.value.trim().toUpperCase();
            
            if (!userInput) {
                status.innerHTML = '❌ Ingresa el código';
                status.className = 'captcha-status error';
                return false;
            }
            
            if (userInput !== currentCaptchaCode) {
                captchaFailCount++;
                status.innerHTML = `❌ Código incorrecto (${captchaFailCount}/5)`;
                status.className = 'captcha-status error';
                refreshCaptcha();
                
                if (captchaFailCount >= 5) {
                    setEvercookieBan(25);
                    userBanned = true;
                    const submitBtn = document.getElementById('submitBtn');
                    const captchaInput = document.getElementById('captchaInput');
                    const refreshBtn = document.getElementById('refreshCaptcha');
                    if (submitBtn) submitBtn.disabled = true;
                    if (captchaInput) captchaInput.disabled = true;
                    if (refreshBtn) refreshBtn.disabled = true;
                    status.innerHTML = '🚫 IP BANEADA por 25 minutos';
                    status.className = 'captcha-status error';
                }
                return false;
            }
            
            captchaFailCount = 0;
            status.innerHTML = '✅ Verificado';
            status.className = 'captcha-status success';
            return true;
        }

        // ========== MENÚ LATERAL ==========
        const sidebar = document.getElementById('sidebar');
        const overlayMenu = document.getElementById('menuOverlay');
        
        function openMenu() {
            if (sidebar) sidebar.classList.add('open');
            if (overlayMenu) overlayMenu.classList.add('active');
        }
        
        function closeMenu() {
            if (sidebar) sidebar.classList.remove('open');
            if (overlayMenu) overlayMenu.classList.remove('active');
        }
        
        const menuBtn = document.getElementById('menuBtn');
        const closeSidebarBtn = document.getElementById('closeSidebarBtn');
        const backToRootItem = document.getElementById('backToRootItem');
        const langEsBtn = document.getElementById('langEsBtn');
        const langEnBtn = document.getElementById('langEnBtn');
        const themeToggle = document.getElementById('themeToggle');
        
        if (menuBtn) menuBtn.addEventListener('click', openMenu);
        if (closeSidebarBtn) closeSidebarBtn.addEventListener('click', closeMenu);
        if (overlayMenu) overlayMenu.addEventListener('click', closeMenu);
        if (backToRootItem) {
            backToRootItem.addEventListener('click', () => {
                window.location.href = 'https://rankyfnf.cc.cd';
            });
        }
        if (langEsBtn) langEsBtn.addEventListener('click', () => applyLanguage('es'));
        if (langEnBtn) langEnBtn.addEventListener('click', () => applyLanguage('en'));
        if (themeToggle) themeToggle.addEventListener('click', toggleTheme);

        // ========== ENVÍO DEL FORMULARIO ==========
        let mouseMoves = 0, pasteCount = 0, startTime = Date.now();
        document.addEventListener('mousemove', () => mouseMoves++);
        document.querySelectorAll('input, textarea').forEach(el => el.addEventListener('paste', () => pasteCount++));

        function isValidEmail(email) {
            return /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email);
        }

        function closeSuccessModal() {
            const modal = document.getElementById('successModal');
            if (modal) modal.style.display = 'none';
        }
        window.closeSuccessModal = closeSuccessModal;

        const form = document.getElementById('applicationForm');
        if (form) {
            form.addEventListener('submit', async (e) => {
                e.preventDefault();
                
                if (userBanned) {
                    alert('Estás baneado por 25 minutos. No puedes enviar el formulario.');
                    return;
                }
                
                const elapsed = (Date.now() - startTime) / 1000;
                const t = texts[currentLang];
                const alertDiv = document.getElementById('securityAlert');
                
                const captchaOk = await verifyCaptcha();
                if (!captchaOk) return;
                
                if (mouseMoves < 4) {
                    if (alertDiv) {
                        alertDiv.innerText = t.errors.mouse;
                        alertDiv.style.display = 'block';
                        setTimeout(() => alertDiv.style.display = 'none', 3000);
                    }
                    return;
                }
                if (elapsed < 5) {
                    if (alertDiv) {
                        alertDiv.innerText = t.errors.speed;
                        alertDiv.style.display = 'block';
                        setTimeout(() => alertDiv.style.display = 'none', 3000);
                    }
                    return;
                }
                if (pasteCount > 4) {
                    if (alertDiv) {
                        alertDiv.innerText = t.errors.paste;
                        alertDiv.style.display = 'block';
                        setTimeout(() => alertDiv.style.display = 'none', 3000);
                    }
                    return;
                }
                
                const btn = document.getElementById('submitBtn');
                if (btn) {
                    btn.disabled = true;
                    btn.innerText = "...";
                }
                
                try {
                    const formData = {
                        discord: document.getElementById('discord')?.value || '',
                        email: document.getElementById('email')?.value || '',
                        role: document.getElementById('role')?.value || '',
                        software: document.getElementById('software')?.value || '',
                        age: document.getElementById('age')?.value || '',
                        hours: document.getElementById('hours')?.value || '',
                        skill: document.getElementById('skill')?.value || '',
                        portfolio: document.getElementById('portfolio')?.value || '',
                        experience: document.getElementById('experience')?.value || '',
                        motivation: document.getElementById('motivation')?.value || '',
                        conflict: document.getElementById('conflict')?.value || '',
                        future: document.getElementById('future')?.value || '',
                        lang: currentLang
                    };
                    
                    const res = await fetch(API_URL, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ type: 'form', formData: formData })
                    });
                    
                    const data = await res.json();
                    
                    if (data.success) {
                        const modalMsg = document.getElementById('modalMessage');
                        const userEmail = document.getElementById('email')?.value || '';
                        if (isValidEmail(userEmail)) {
                            modalMsg.innerHTML = `<p>${t.modalTextValid}</p><div class="contact-email" style="background:var(--accent-soft);padding:0.5rem;border-radius:1rem;">${t.contactEmail}</div><p>✅ Hemos recibido: <strong>${userEmail}</strong></p>`;
                        } else {
                            modalMsg.innerHTML = `<p>${t.modalTextInvalid}</p>`;
                        }
                        const modal = document.getElementById('successModal');
                        if (modal) modal.style.display = 'flex';
                        if (form) form.reset();
                        captchaFailCount = 0;
                        refreshCaptcha();
                    } else {
                        alert("Error en el envío: " + (data.msg || "Intenta de nuevo"));
                        refreshCaptcha();
                    }
                } catch (err) {}
                finally {
                    if (btn) {
                        btn.disabled = false;
                        btn.innerText = texts[currentLang].submitBtn;
                    }
                }
            });
        }

        // ========== INICIALIZACIÓN ==========
        initTheme();
        const savedLang = getCookie('ranky_lang');
        applyLanguage(savedLang === 'en' ? 'en' : 'es');
        refreshCaptcha();
        checkBanStatus();
        
        const refreshBtn = document.getElementById('refreshCaptcha');
        const captchaCanvas = document.getElementById('captchaCanvas');
        if (refreshBtn) refreshBtn.addEventListener('click', () => refreshCaptcha());
        if (captchaCanvas) captchaCanvas.addEventListener('click', () => refreshCaptcha());
    </script>
