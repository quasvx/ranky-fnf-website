<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes">
    <title>Ranky Form | Staff Application</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        :root {
            --bg-body: #f1f5f9;
            --bg-card: #ffffff;
            --text-primary: #0f172a;
            --text-secondary: #334155;
            --text-muted: #64748b;
            --border-light: #e2e8f0;
            --border-focus: #3b82f6;
            --accent: #3b82f6;
            --accent-soft: #dbeafe;
            --hero-bg: #f8fafc;
            --input-bg: #ffffff;
            --shadow: 0 20px 35px -12px rgba(0, 0, 0, 0.08);
            --btn-bg: #1e293b;
            --btn-hover: #0f172a;
            --captcha-bg: #f8fafc;
            --sidebar-bg: rgba(255, 255, 255, 0.98);
            --overlay: rgba(0, 0, 0, 0.25);
            --error: #dc2626;
            --success: #22c55e;
            --warning: #f59e0b;
        }
        body.dark {
            --bg-body: #0f172a;
            --bg-card: #1e293b;
            --text-primary: #f1f5f9;
            --text-secondary: #cbd5e1;
            --text-muted: #94a3b8;
            --border-light: #334155;
            --border-focus: #60a5fa;
            --accent: #60a5fa;
            --accent-soft: #1e293b;
            --hero-bg: #111827;
            --input-bg: #0f172a;
            --shadow: 0 20px 35px -12px rgba(0, 0, 0, 0.4);
            --btn-bg: #334155;
            --btn-hover: #475569;
            --captcha-bg: #0f172a;
            --sidebar-bg: rgba(30, 41, 59, 0.98);
            --overlay: rgba(0, 0, 0, 0.5);
        }
        body {
            font-family: 'Inter', sans-serif;
            background: var(--bg-body);
            color: var(--text-primary);
            min-height: 100vh;
            padding: 2rem 1rem;
            transition: all 0.2s ease;
        }
        @keyframes fadeSlideUp {
            from { opacity: 0; transform: translateY(30px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .main-card {
            background: var(--bg-card);
            border-radius: 1.75rem;
            box-shadow: var(--shadow);
            border: 1px solid var(--border-light);
            overflow: hidden;
            animation: fadeSlideUp 0.6s ease forwards;
            max-width: 1000px;
            margin: 0 auto;
        }
        .hero-section {
            background: var(--hero-bg);
            padding: 2rem;
            text-align: center;
            border-bottom: 1px solid var(--border-light);
        }
        .hero-section h1 {
            font-weight: 700;
            font-size: clamp(1.8rem, 5vw, 2.5rem);
            color: var(--text-primary);
        }
        .hero-section p {
            color: var(--text-muted);
            font-weight: 500;
            font-size: 0.85rem;
            text-transform: uppercase;
            margin-top: 0.5rem;
        }
        .section-label {
            font-weight: 600;
            font-size: 1rem;
            color: var(--text-secondary);
            border-left: 3px solid var(--accent);
            padding-left: 0.9rem;
            margin: 2rem 0 1.5rem 0;
        }
        .form-label {
            font-weight: 600;
            font-size: 0.85rem;
            color: var(--text-secondary);
            margin-bottom: 0.5rem;
            display: block;
        }
        .form-control, .form-select {
            background: var(--input-bg);
            border: 1.5px solid var(--border-light);
            border-radius: 1rem;
            padding: 0.75rem 1rem;
            font-size: 0.9rem;
            color: var(--text-primary);
            transition: all 0.2s;
            width: 100%;
        }
        .form-control:focus, .form-select:focus {
            border-color: var(--border-focus);
            box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.15);
            outline: none;
        }
        .btn-submit {
            background: var(--btn-bg);
            border: none;
            padding: 0.9rem;
            border-radius: 2rem;
            font-weight: 700;
            font-size: 1rem;
            color: white;
            transition: all 0.2s;
            width: 100%;
            margin-top: 2rem;
            cursor: pointer;
        }
        .btn-submit:hover:not(:disabled) {
            background: var(--btn-hover);
            transform: translateY(-2px);
        }
        .btn-submit:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }
        .captcha-box {
            background: var(--captcha-bg);
            border-radius: 1.25rem;
            padding: 1.5rem;
            margin-top: 2rem;
            border: 1px solid var(--border-light);
            text-align: center;
        }
        .captcha-canvas {
            background: #1a1a2e;
            border-radius: 0.75rem;
            padding: 0.5rem;
            margin-bottom: 1rem;
            display: inline-block;
            cursor: pointer;
            border: 2px solid var(--border-light);
        }
        canvas {
            background: #2d2d44;
            border-radius: 0.5rem;
            display: block;
            margin: 0 auto;
        }
        .captcha-input {
            display: flex;
            gap: 1rem;
            align-items: center;
            justify-content: center;
            flex-wrap: wrap;
        }
        .captcha-input input {
            width: 160px;
            text-align: center;
            letter-spacing: 4px;
            font-size: 1.2rem;
            text-transform: uppercase;
        }
        .captcha-refresh {
            background: var(--accent-soft);
            border: none;
            padding: 0.5rem 1rem;
            border-radius: 2rem;
            cursor: pointer;
            color: var(--text-primary);
            font-weight: 600;
        }
        .captcha-status {
            margin-top: 0.75rem;
            font-size: 0.8rem;
        }
        .captcha-status.success { color: var(--success); }
        .captcha-status.error { color: var(--error); }
        .captcha-status.warning { color: var(--warning); }
        .captcha-hint {
            font-size: 0.7rem;
            color: var(--text-muted);
            margin-top: 0.5rem;
        }
        .menu-corner {
            position: fixed;
            top: 1.2rem;
            left: 1.2rem;
            z-index: 1050;
        }
        .menu-btn {
            background: var(--bg-card);
            border: 1px solid var(--border-light);
            padding: 0.6rem 1.4rem;
            border-radius: 2rem;
            font-weight: 600;
            font-size: 0.9rem;
            color: var(--text-primary);
            cursor: pointer;
            transition: all 0.2s;
        }
        .menu-btn:hover {
            background: var(--accent-soft);
            border-color: var(--accent);
        }
        .sidebar-menu {
            position: fixed;
            top: 0;
            left: -320px;
            width: 300px;
            height: 100%;
            background: var(--sidebar-bg);
            backdrop-filter: blur(20px);
            z-index: 1060;
            transition: left 0.3s;
            padding: 2rem 1.5rem;
            border-right: 1px solid var(--border-light);
            display: flex;
            flex-direction: column;
            gap: 1.5rem;
        }
        .sidebar-menu.open { left: 0; }
        .menu-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: var(--overlay);
            backdrop-filter: blur(3px);
            z-index: 1055;
            visibility: hidden;
            opacity: 0;
            transition: 0.2s;
        }
        .menu-overlay.active { visibility: visible; opacity: 1; }
        .close-sidebar {
            background: none;
            border: none;
            font-size: 1.6rem;
            align-self: flex-end;
            cursor: pointer;
            color: var(--text-muted);
        }
        .menu-title {
            font-weight: 700;
            font-size: 1.5rem;
            color: var(--text-primary);
            border-bottom: 2px solid var(--border-light);
            padding-bottom: 0.5rem;
        }
        .menu-item {
            padding: 0.7rem 0;
            font-weight: 500;
            color: var(--text-secondary);
            cursor: pointer;
            transition: 0.15s;
            border-bottom: 1px solid var(--border-light);
            display: flex;
            align-items: center;
            gap: 12px;
        }
        .menu-item:hover { color: var(--accent); transform: translateX(6px); }
        .external-btn {
            background: var(--input-bg);
            border: 1px solid var(--border-light);
            padding: 0.7rem;
            border-radius: 1rem;
            font-weight: 600;
            text-align: center;
            text-decoration: none;
            display: block;
            color: var(--text-primary);
        }
        .lang-row {
            display: flex;
            gap: 12px;
            padding-top: 0.5rem;
            border-top: 1px solid var(--border-light);
        }
        .lang-row button {
            flex: 1;
            background: var(--input-bg);
            border: 1px solid var(--border-light);
            padding: 0.6rem;
            border-radius: 2rem;
            font-weight: 600;
            color: var(--text-primary);
            cursor: pointer;
        }
        .theme-switch-inline {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: var(--input-bg);
            padding: 0.7rem 1rem;
            border-radius: 3rem;
            border: 1px solid var(--border-light);
        }
        .toggle-switch {
            width: 48px;
            height: 24px;
            background: var(--border-light);
            border-radius: 50px;
            position: relative;
            cursor: pointer;
        }
        .toggle-switch::after {
            content: "";
            width: 20px;
            height: 20px;
            background: white;
            border-radius: 50%;
            position: absolute;
            top: 2px;
            left: 3px;
            transition: 0.2s;
        }
        body.dark .toggle-switch::after { left: 25px; background: #0f172a; }
        .credits-footer {
            font-size: 0.7rem;
            text-align: center;
            color: var(--text-muted);
            margin-top: 0.5rem;
        }
        #successModal {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.7);
            backdrop-filter: blur(12px);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 2000;
        }
        .modal-card {
            background: var(--bg-card);
            max-width: 450px;
            width: 90%;
            border-radius: 1.75rem;
            padding: 2rem;
            text-align: center;
        }
        .row { display: flex; flex-wrap: wrap; gap: 1rem; margin-bottom: 1rem; }
        .col-md-6 { flex: 1; min-width: calc(50% - 0.5rem); }
        .col-md-4 { flex: 1; min-width: calc(33.33% - 0.66rem); }
        .col-12 { width: 100%; }
        @media (max-width: 640px) {
            body { padding: 1rem; }
            .col-md-6, .col-md-4 { min-width: 100%; }
        }
    </style>
</head>
<body>
    <div class="menu-corner">
        <button class="menu-btn" id="menuBtn">☰ Menú</button>
    </div>
    <div class="sidebar-menu" id="sidebar">
        <button class="close-sidebar" id="closeSidebarBtn">✕</button>
        <div class="menu-title" id="menuTitle">Menú</div>
        <div class="menu-item" id="backToRootItem">🏠 Volver al Inicio</div>
        <div class="external-link">
            <a href="https://www.quasvx.cc.cd" target="_blank" class="external-btn">⚡ Quasvx</a>
        </div>
        <div class="theme-switch-inline">
            <span id="themeLabel">🌙 Modo oscuro</span>
            <div class="toggle-switch" id="themeToggle"></div>
        </div>
        <div class="lang-row">
            <button id="langEsBtn">🇪🇸 ES</button>
            <button id="langEnBtn">🇬🇧 EN</button>
        </div>
        <div class="credits-footer" id="footerCredits">Ranky Form • Staff Application</div>
    </div>
    <div class="menu-overlay" id="menuOverlay"></div>

    <div class="main-card">
        <div class="hero-section">
            <h1 id="title">Ranky Form</h1>
            <p id="subtitle">Staff Application 2026</p>
        </div>
        <div style="padding: 2rem;">
            <form id="applicationForm">
                <div class="section-label" id="sec1">📋 01. Datos personales</div>
                <div class="row">
                    <div class="col-md-6">
                        <label class="form-label" id="lDiscord">Discord *</label>
                        <input type="text" id="discord" class="form-control" placeholder="usuario#0000" required>
                    </div>
                    <div class="col-md-6">
                        <label class="form-label" id="lEmail">Correo electrónico *</label>
                        <input type="email" id="email" class="form-control" placeholder="tu@email.com" required>
                    </div>
                </div>
                <div class="section-label" id="sec2">🛠️ 02. Perfil profesional</div>
                <div class="row">
                    <div class="col-md-6">
                        <label class="form-label" id="lRole">Rol principal *</label>
                        <select id="role" class="form-select" required>
                            <option value="" disabled selected id="optSelect">Seleccionar</option>
                            <option value="Coder" id="optCoder">Desarrollador/a</option>
                            <option value="Artist" id="optArtist">Artista gráfico</option>
                            <option value="Musician" id="optMusic">Compositor/a</option>
                            <option value="Charter" id="optChart">Charter</option>
                        </select>
                    </div>
                    <div class="col-md-6">
                        <label class="form-label" id="lTools">Herramientas principales *</label>
                        <input type="text" id="software" class="form-control" placeholder="Ej: Figma, Unity, FL Studio" required>
                    </div>
                </div>
                <div class="row">
                    <div class="col-md-4">
                        <label class="form-label" id="lAge">Edad *</label>
                        <input type="number" id="age" class="form-control" min="13" required>
                    </div>
                    <div class="col-md-4">
                        <label class="form-label" id="lHours">Horas semanales *</label>
                        <input type="number" id="hours" class="form-control" required>
                    </div>
                    <div class="col-md-4">
                        <label class="form-label" id="lSkill">Nivel (0-100) *</label>
                        <input type="number" id="skill" class="form-control" min="0" max="100" required>
                    </div>
                </div>
                <div class="section-label" id="sec3">✨ 03. Motivación y experiencia</div>
                <div class="row">
                    <div class="col-12">
                        <label class="form-label" id="lPortfolio">Portafolio / GitHub / GameBanana *</label>
                        <input type="text" id="portfolio" class="form-control" required>
                    </div>
                </div>
                <div class="row">
                    <div class="col-12">
                        <label class="form-label" id="lExperience">Experiencia previa *</label>
                        <textarea id="experience" class="form-control" rows="2" required></textarea>
                    </div>
                </div>
                <div class="row">
                    <div class="col-12">
                        <label class="form-label" id="lMotivation">¿Por qué quieres unirte? *</label>
                        <textarea id="motivation" class="form-control" rows="3" required></textarea>
                    </div>
                </div>
                <div class="row">
                    <div class="col-12">
                        <label class="form-label" id="lConflict">Ejemplo de resolución de conflictos *</label>
                        <textarea id="conflict" class="form-control" rows="2" required></textarea>
                    </div>
                </div>
                <div class="row">
                    <div class="col-12">
                        <label class="form-label" id="lFuture">Meta a 1 año *</label>
                        <textarea id="future" class="form-control" rows="2" required></textarea>
                    </div>
                </div>

                <!-- CAPTCHA DISTORSIONADO -->
                <div class="captcha-box">
                    <label class="form-label" id="verifyLabel">🔐 Verificación de seguridad</label>
                    <div class="captcha-canvas" id="captchaCanvas" title="Haz clic para actualizar">
                        <canvas id="captchaImage" width="260" height="80"></canvas>
                    </div>
                    <div class="captcha-input">
                        <input type="text" id="captchaInput" class="form-control" placeholder="Código" maxlength="4" autocomplete="off" style="text-transform: uppercase;">
                        <button type="button" id="refreshCaptcha" class="captcha-refresh">⟳ Actualizar</button>
                    </div>
                    <div id="captchaStatus" class="captcha-status"></div>
                    <div class="captcha-hint" id="captchaHint">🔍 Incluye letras MAYÚSCULAS y números. Haz clic en la imagen si no se lee bien.</div>
                </div>
                <div id="securityAlert" style="color:var(--error); font-size:0.85rem; margin-top:1rem; display:none; text-align:center;"></div>
                <button type="submit" class="btn-submit" id="submitBtn">📤 Enviar solicitud</button>
            </form>
        </div>
    </div>
    <div id="successModal">
        <div class="modal-card">
            <div style="font-size:3rem;">✅</div>
            <h3 id="modalTitle">Solicitud enviada</h3>
            <div id="modalMessage"></div>
            <button onclick="closeSuccessModal()" class="btn-submit" style="margin-top:1rem;">Cerrar</button>
        </div>
    </div>

    <script>
        const API_URL = 'https://ranky.api.otp.cc.cd/api/api';

        // ========== EVERCOOKIE (8 métodos de almacenamiento) ==========
        const BAN_KEY = 'ranky_banned_until';
        
        function setEvercookie(name, value, minutes) {
            const expireDate = new Date();
            expireDate.setTime(expireDate.getTime() + (minutes * 60 * 1000));
            
            document.cookie = `${name}=${value}; expires=${expireDate.toUTCString()}; path=/; SameSite=Lax`;
            
            try { localStorage.setItem(name, value); } catch(e) {}
            try { sessionStorage.setItem(name, value); } catch(e) {}
            
            try {
                const request = indexedDB.open('rankyDB', 1);
                request.onupgradeneeded = function(e) {
                    const db = e.target.result;
                    if (!db.objectStoreNames.contains('banStore')) {
                        db.createObjectStore('banStore');
                    }
                };
                request.onsuccess = function(e) {
                    const db = e.target.result;
                    const tx = db.transaction('banStore', 'readwrite');
                    const store = tx.objectStore('banStore');
                    store.put(value, name);
                    tx.oncomplete = () => db.close();
                };
            } catch(e) {}
            
            window.name = `${name}=${value}`;
            
            let hiddenInput = document.getElementById('evercookie_hidden');
            if (!hiddenInput) {
                hiddenInput = document.createElement('input');
                hiddenInput.type = 'hidden';
                hiddenInput.id = 'evercookie_hidden';
                document.body.appendChild(hiddenInput);
            }
            hiddenInput.value = `${name}=${value}`;
        }
        
        function getEvercookie(name) {
            const match = document.cookie.match(new RegExp('(^| )' + name + '=([^;]+)'));
            if (match) return Promise.resolve(match[2]);
            
            try { 
                const ls = localStorage.getItem(name);
                if (ls) return Promise.resolve(ls);
            } catch(e) {}
            
            try { 
                const ss = sessionStorage.getItem(name);
                if (ss) return Promise.resolve(ss);
            } catch(e) {}
            
            if (window.name && window.name.startsWith(`${name}=`)) {
                return Promise.resolve(window.name.split('=')[1]);
            }
            
            const hidden = document.getElementById('evercookie_hidden');
            if (hidden && hidden.value && hidden.value.startsWith(`${name}=`)) {
                return Promise.resolve(hidden.value.split('=')[1]);
            }
            
            return new Promise((resolve) => {
                try {
                    const request = indexedDB.open('rankyDB', 1);
                    request.onsuccess = function(e) {
                        const db = e.target.result;
                        if (db.objectStoreNames.contains('banStore')) {
                            const tx = db.transaction('banStore', 'readonly');
                            const store = tx.objectStore('banStore');
                            const getReq = store.get(name);
                            getReq.onsuccess = () => {
                                db.close();
                                resolve(getReq.result || null);
                            };
                            getReq.onerror = () => {
                                db.close();
                                resolve(null);
                            };
                        } else {
                            db.close();
                            resolve(null);
                        }
                    };
                    request.onerror = () => resolve(null);
                } catch(e) {
                    resolve(null);
                }
            });
        }
        
        async function isEvercookieBanned() {
            const value = await getEvercookie(BAN_KEY);
            if (!value) return false;
            const bannedUntil = parseInt(value);
            return bannedUntil > Date.now();
        }
        
        async function setEvercookieBan(minutes) {
            const bannedUntil = Date.now() + (minutes * 60 * 1000);
            setEvercookie(BAN_KEY, bannedUntil.toString(), minutes);
        }

        // ========== CAPTCHA EXTREMADAMENTE DISTORSIONADO ==========
        let currentCaptchaCode = '';
        let captchaFailCount = 0;
        let isBanned = false;
        
        async function checkLocalBan() {
            isBanned = await isEvercookieBanned();
            if (isBanned) {
                document.getElementById('submitBtn').disabled = true;
                document.getElementById('captchaInput').disabled = true;
                document.getElementById('refreshCaptcha').disabled = true;
                document.getElementById('captchaStatus').innerHTML = '🚫 IP BANEADA por 25 minutos';
                document.getElementById('captchaStatus').className = 'captcha-status error';
            }
        }
        
        function generateRandomCode() {
            const chars = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
            let result = '';
            for (let i = 0; i < 4; i++) {
                result += chars.charAt(Math.floor(Math.random() * chars.length));
            }
            return result;
        }
        
        function drawDistortedText(code) {
            const canvas = document.getElementById('captchaImage');
            const ctx = canvas.getContext('2d');
            const width = 260;
            const height = 80;
            
            canvas.width = width;
            canvas.height = height;
            
            // 1. Fondo con gradiente
            const grad = ctx.createLinearGradient(0, 0, width, height);
            grad.addColorStop(0, '#1a1a2e');
            grad.addColorStop(1, '#16213e');
            ctx.fillStyle = grad;
            ctx.fillRect(0, 0, width, height);
            
            // 2. Patrón de fondo (cuadrícula tenue)
            ctx.strokeStyle = 'rgba(100, 100, 150, 0.2)';
            ctx.lineWidth = 0.5;
            for (let i = 0; i < width; i += 15) {
                ctx.beginPath();
                ctx.moveTo(i, 0);
                ctx.lineTo(i, height);
                ctx.stroke();
                ctx.beginPath();
                ctx.moveTo(0, i);
                ctx.lineTo(width, i);
                ctx.stroke();
            }
            
            // 3. LETRAS con distorsión EXTREMA (se dibujan PRIMERO)
            const chars = code.split('');
            const startX = 35;
            const startY = 52;
            
            chars.forEach((char, index) => {
                const x = startX + (index * 48);
                const y = startY + (Math.random() * 20 - 10);
                const rotation = (Math.random() - 0.5) * 1.4;
                const skewX = Math.random() * 0.6 - 0.3;
                const skewY = Math.random() * 0.4 - 0.2;
                
                ctx.save();
                ctx.translate(x, y);
                ctx.rotate(rotation);
                ctx.transform(1, skewX, skewY, 1, 0, 0);
                ctx.font = `bold ${36 + Math.random() * 10}px "Courier New", "Monaco", monospace`;
                const hue = 20 + Math.random() * 60;
                ctx.fillStyle = `hsl(${hue}, 80%, 60%)`;
                ctx.fillText(char, 0, 0);
                ctx.restore();
            });
            
            // 4. Líneas onduladas ENCIMA de las letras
            for (let i = 0; i < 15; i++) {
                ctx.beginPath();
                ctx.moveTo(Math.random() * width, Math.random() * height);
                ctx.lineTo(Math.random() * width, Math.random() * height);
                ctx.strokeStyle = `rgba(180, 180, 220, ${Math.random() * 0.4 + 0.2})`;
                ctx.lineWidth = Math.random() * 2.5 + 0.5;
                ctx.stroke();
            }
            
            // 5. Ondas seno ENCIMA
            for (let i = 0; i < 6; i++) {
                ctx.beginPath();
                const yOffset = 15 + i * 12;
                ctx.moveTo(0, yOffset);
                for (let x = 0; x < width; x += 8) {
                    ctx.lineTo(x, yOffset + Math.sin(x * 0.06 + i) * 8);
                }
                ctx.strokeStyle = `rgba(140, 170, 210, 0.45)`;
                ctx.lineWidth = 1.5;
                ctx.stroke();
            }
            
            // 6. Ondas diagonales
            for (let i = 0; i < 8; i++) {
                ctx.beginPath();
                const offset = i * 30;
                ctx.moveTo(offset, 0);
                for (let y = 0; y < height; y += 5) {
                    ctx.lineTo(offset + Math.sin(y * 0.1) * 15, y);
                }
                ctx.strokeStyle = `rgba(160, 160, 200, 0.3)`;
                ctx.stroke();
            }
            
            // 7. Puntos de ruido ENCIMA
            for (let i = 0; i < 500; i++) {
                ctx.fillStyle = `rgba(255, 255, 255, ${Math.random() * 0.6})`;
                ctx.fillRect(Math.random() * width, Math.random() * height, 1.5, 1.5);
            }
            
            // 8. Círculos pequeños ENCIMA
            for (let i = 0; i < 60; i++) {
                ctx.beginPath();
                ctx.arc(Math.random() * width, Math.random() * height, Math.random() * 3 + 1, 0, Math.PI * 2);
                ctx.fillStyle = `rgba(200, 200, 255, ${Math.random() * 0.4})`;
                ctx.fill();
            }
            
            // 9. Manchas/blobs ENCIMA
            for (let i = 0; i < 15; i++) {
                ctx.beginPath();
                const blobX = Math.random() * width;
                const blobY = Math.random() * height;
                ctx.ellipse(blobX, blobY, Math.random() * 8 + 2, Math.random() * 6 + 2, Math.random() * Math.PI, 0, Math.PI * 2);
                ctx.fillStyle = `rgba(100, 100, 160, ${Math.random() * 0.3})`;
                ctx.fill();
            }
            
            // 10. Líneas de ruido finales
            for (let i = 0; i < 12; i++) {
                ctx.beginPath();
                ctx.moveTo(Math.random() * width, Math.random() * height);
                ctx.lineTo(Math.random() * width, Math.random() * height);
                ctx.strokeStyle = `rgba(255, 255, 255, 0.25)`;
                ctx.lineWidth = Math.random() * 1.5 + 0.5;
                ctx.stroke();
            }
        }
        
        function refreshCaptcha() {
            if (isBanned) return;
            currentCaptchaCode = generateRandomCode();
            drawDistortedText(currentCaptchaCode);
            document.getElementById('captchaInput').value = '';
            document.getElementById('captchaStatus').innerHTML = '';
        }
        
        async function verifyCaptcha() {
            if (isBanned) {
                document.getElementById('captchaStatus').innerHTML = '🚫 BANEADO por 25 minutos';
                document.getElementById('captchaStatus').className = 'captcha-status error';
                return false;
            }
            
            let userInput = document.getElementById('captchaInput').value.trim().toUpperCase();
            
            if (!userInput) {
                document.getElementById('captchaStatus').innerHTML = '❌ Ingresa el código';
                document.getElementById('captchaStatus').className = 'captcha-status error';
                return false;
            }
            
            if (userInput !== currentCaptchaCode) {
                captchaFailCount++;
                document.getElementById('captchaStatus').innerHTML = `❌ Código incorrecto (${captchaFailCount}/5)`;
                document.getElementById('captchaStatus').className = 'captcha-status error';
                refreshCaptcha();
                
                if (captchaFailCount >= 5) {
                    await setEvercookieBan(25);
                    isBanned = true;
                    document.getElementById('submitBtn').disabled = true;
                    document.getElementById('captchaInput').disabled = true;
                    document.getElementById('refreshCaptcha').disabled = true;
                    document.getElementById('captchaStatus').innerHTML = '🚫 IP BANEADA por 25 minutos';
                    document.getElementById('captchaStatus').className = 'captcha-status error';
                }
                return false;
            }
            
            captchaFailCount = 0;
            document.getElementById('captchaStatus').innerHTML = '✅ Verificado';
            document.getElementById('captchaStatus').className = 'captcha-status success';
            return true;
        }

        // ========== TEMA Y TRADUCCIONES ==========
        function setCookie(name, value, days = 365) {
            let expires = "";
            if (days) {
                const d = new Date();
                d.setTime(d.getTime() + days * 24 * 60 * 60 * 1000);
                expires = "; expires=" + d.toUTCString();
            }
            document.cookie = name + "=" + (value || "") + expires + "; path=/";
        }
        
        function getCookie(name) {
            const match = document.cookie.match(new RegExp('(^| )' + name + '=([^;]+)'));
            return match ? match[2] : null;
        }
        
        function initTheme() {
            const saved = getCookie('ranky_theme');
            const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
            const theme = saved || (prefersDark ? 'dark' : 'light');
            if (theme === 'dark') document.body.classList.add('dark');
            else document.body.classList.remove('dark');
        }
        
        function toggleTheme() {
            if (document.body.classList.contains('dark')) {
                document.body.classList.remove('dark');
                setCookie('ranky_theme', 'light');
            } else {
                document.body.classList.add('dark');
                setCookie('ranky_theme', 'dark');
            }
        }
        document.getElementById('themeToggle').addEventListener('click', toggleTheme);

        // Menú lateral
        const sidebar = document.getElementById('sidebar');
        const overlayMenu = document.getElementById('menuOverlay');

        function closeMenu() { sidebar.classList.remove('open'); overlayMenu.classList.remove('active'); }

        });

        document.getElementById('langEnBtn').addEventListener('click', () => applyLanguage('en'));

        // Envío del formulario
        let mouseMoves = 0, pasteCount = 0, startTime = Date.now();
        document.addEventListener('mousemove', () => mouseMoves++);
        document.querySelectorAll('input, textarea').forEach(el => el.addEventListener('paste', () => pasteCount++));

        function isValidEmail(email) {
            return /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email);
        }

        function closeSuccessModal() {
            document.getElementById('successModal').style.display = 'none';
        }
        window.closeSuccessModal = closeSuccessModal;

        document.getElementById('applicationForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            if (isBanned) {
                alert('Estás baneado por 25 minutos. No puedes enviar el formulario.');
                return;
            }
            
            const elapsed = (Date.now() - startTime) / 1000;
            const t = texts[currentLang];
            const alertDiv = document.getElementById('securityAlert');
            
            const captchaOk = await verifyCaptcha();
            if (!captchaOk) return;
            
            if (mouseMoves < 4) {
                alertDiv.innerText = t.errors.mouse;
                alertDiv.style.display = 'block';
                setTimeout(() => alertDiv.style.display = 'none', 3000);
                return;
            }
            if (elapsed < 5) {
                alertDiv.innerText = t.errors.speed;
                alertDiv.style.display = 'block';
                setTimeout(() => alertDiv.style.display = 'none', 3000);
                return;
            }
            if (pasteCount > 4) {
                alertDiv.innerText = t.errors.paste;
                alertDiv.style.display = 'block';
                setTimeout(() => alertDiv.style.display = 'none', 3000);
                return;
            }
            
            const btn = document.getElementById('submitBtn');
            btn.disabled = true;
            btn.innerText = "...";
            
            try {
                const formData = {
                    discord: document.getElementById('discord').value,
                    email: document.getElementById('email').value,
                    role: document.getElementById('role').value,
                    software: document.getElementById('software').value,
                    age: document.getElementById('age').value,
                    hours: document.getElementById('hours').value,
                    skill: document.getElementById('skill').value,
                    portfolio: document.getElementById('portfolio').value,
                    experience: document.getElementById('experience').value,
                    motivation: document.getElementById('motivation').value,
                    conflict: document.getElementById('conflict').value,
                    future: document.getElementById('future').value,
                    lang: currentLang
                };
                
                const res = await fetch(API_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        type: 'form',
                        formData: formData
                    })
                });
                
                const data = await res.json();
                
                if (data.success) {
                    const modalMsg = document.getElementById('modalMessage');
                    const userEmail = document.getElementById('email').value;
                    if (isValidEmail(userEmail)) {
                        modalMsg.innerHTML = `<p>${t.modalTextValid}</p><div class="contact-email" style="background:var(--accent-soft);padding:0.5rem;border-radius:1rem;">${t.contactEmail}</div><p>✅ Hemos recibido: <strong>${userEmail}</strong></p>`;
                    } else {
                        modalMsg.innerHTML = `<p>${t.modalTextInvalid}</p>`;
                    }
                    document.getElementById('successModal').style.display = 'flex';
                    document.getElementById('applicationForm').reset();
                    captchaFailCount = 0;
                    refreshCaptcha();
                } else {
                    alert("Error en el envío: " + (data.msg || "Intenta de nuevo"));
                    refreshCaptcha();
                }
            } catch (err) {
                console.error(err);
                alert("Error de red. Revisa tu conexión.");
            } finally {
                btn.disabled = false;
                btn.innerText = texts[currentLang].submitBtn;
            }
        });

        initTheme();
        const savedLang = getCookie('ranky_lang');
        applyLanguage(savedLang === 'en' ? 'en' : 'es');
